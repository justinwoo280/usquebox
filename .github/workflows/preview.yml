name: Preview Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preview APK
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/go
      GOTOOLCHAIN: local
    steps:
      - name: Checkout usquebox
        uses: actions/checkout@v4

      - name: Fetch usque source
        run: bash fetch.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: ../usque/go.sum

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install NDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" "ndk;28.1.13356709"

      - name: Install gomobile
        working-directory: ../usque
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > usquebox-release.jks
            cat > keystore.properties <<EOF
          KEYSTORE_FILE=usquebox-release.jks
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME=${{ secrets.ALIAS_NAME }}
          ALIAS_PASS=${{ secrets.ALIAS_PASS }}
          EOF
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing configured (V1+V2+V3)"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building unsigned"
          fi

      - name: Build AAR
        run: bash build.sh

      - name: Build APK
        run: |
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -print -quit)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: usquebox-preview-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
